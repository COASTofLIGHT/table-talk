<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Complete the Sentence — 60</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    background: #F2D9A6;
    overflow: hidden;
  }

  .back {
    position: fixed;
    top: max(20px, env(safe-area-inset-top, 0px));
    left: 20px;
    z-index: 2;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: #10303A;
    opacity: 0.7;
    text-decoration: none;
  }
  .back:hover { opacity: 1; text-decoration: underline; }

  button.stage {
    appearance: none;
    -webkit-appearance: none;
    border: none;
    outline: none;
    background: #F2D9A6;
    width: 100%;
    height: 100%;
    height: 100dvh;
    margin: 0;
    padding: 8vw 7vw;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }

  button.stage:focus {
    outline: none;
  }

  .sentence {
    font-family: 'Fraunces', Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 500;
    font-style: normal;
    font-size: clamp(28px, 6vw, 68px);
    line-height: 1.25;
    color: #10303A;
    letter-spacing: -0.01em;
    max-width: 900px;
    transition: opacity 500ms ease, filter 500ms ease;
    opacity: 1;
    filter: blur(0px);
  }

  .sentence.fading {
    opacity: 0;
    filter: blur(6px);
  }

  .hint {
    position: fixed;
    bottom: 28px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #10303A;
    opacity: 0.45;
    transition: opacity 1.2s ease;
    pointer-events: none;
  }

  .hint.hidden { opacity: 0; }

  .count {
    position: fixed;
    top: 28px;
    right: 32px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: #10303A;
    opacity: 0.35;
    pointer-events: none;
  }
</style>
</head>
<body>

<a class="back" href="https://coastoflight.github.io/table-talk/">&larr; Table Talk</a>

<button class="stage" id="stage" aria-label="Show another sentence starter">
  <div class="sentence" id="sentence"></div>
</button>

<div class="hint" id="hint">tap for another</div>
<div class="count" id="count"></div>

<script>
  const sentences = [
    "Happiness is\u2026",
    "On Mondays\u2026",
    "In my free time\u2026",
    "My favourite\u2026",
    "Yesterday\u2026",
    "In the future\u2026",
    "I never\u2026",
    "I always\u2026",
    "One place I would love to visit is\u2026",
    "My favourite meal to cook is\u2026",
    "A hobby I enjoy is\u2026",
    "My dream job is\u2026",
    "My favourite type of weather is\u2026",
    "If I could study any subject, it would be\u2026",
    "The best part of my day is\u2026",
    "An interesting fact about my hometown is\u2026",
    "My favourite social media platform is\u2026",
    "The most useful technology for me is\u2026",
    "If I could start a YouTube channel, it would be about\u2026",
    "A new skill I want to learn this year is\u2026",
    "A language I would love to learn is\u2026",
    "An outdoor activity I enjoy is\u2026",
    "The best gift I've ever received was\u2026",
    "My best friend is\u2026",
    "On weekends, I usually\u2026",
    "My favourite film is\u2026",
    "The last book I read was\u2026",
    "My favourite season is\u2026",
    "I'm afraid of\u2026",
    "My family is\u2026",
    "I feel happy when\u2026",
    "My favourite sport is\u2026",
    "The last time I laughed a lot was\u2026",
    "If I had more time, I would\u2026",
    "My favourite animal is\u2026",
    "I usually eat breakfast at\u2026",
    "My favourite colour is\u2026",
    "At school, I'm good at\u2026",
    "My favourite song right now is\u2026",
    "I get nervous when\u2026",
    "My perfect weekend would be\u2026",
    "The last holiday I went on was\u2026",
    "I would love to meet\u2026",
    "My favourite time of day is\u2026",
    "I feel proud when\u2026",
    "If I won the lottery, I would\u2026",
    "My favourite app is\u2026",
    "The best advice I've ever received is\u2026",
    "I relax by\u2026",
    "My favourite place at home is\u2026"
  ];

  const sentenceEl = document.getElementById('sentence');
  const hintEl = document.getElementById('hint');
  const countEl = document.getElementById('count');
  const stageEl = document.getElementById('stage');

  function shuffle(list) {
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [list[i], list[j]] = [list[j], list[i]];
    }
    return list;
  }

  /* Draws from a shuffled deck so every sentence is used once before any repeat. */
  let deck = [];
  let current = null;
  let shown = 0;

  function next() {
    if (!deck.length) deck = shuffle(sentences.slice());
    let s = deck.pop();
    if (s === current && deck.length) s = deck.pop();
    current = s;
    shown++;

    sentenceEl.classList.add('fading');

    setTimeout(() => {
      sentenceEl.textContent = s;
      countEl.textContent = shown + " / " + sentences.length;
      sentenceEl.classList.remove('fading');
    }, 350);

    if (hintEl && !hintEl.classList.contains('hidden')) {
      hintEl.classList.add('hidden');
    }
  }

  (function init() {
    deck = shuffle(sentences.slice());
    current = deck.pop();
    shown = 1;
    sentenceEl.textContent = current;
    countEl.textContent = shown + " / " + sentences.length;
  })();

  stageEl.addEventListener('click', next);
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      next();
    }
  });
</script>

</body>
</html>
